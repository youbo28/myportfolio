<div
  *ngIf="isVisible"
  @backdropAnimation
  (click)="onBackdropClick($event)"
  class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/60 backdrop-blur-sm"
>

    <!-- Fireworks Container -->
    <div class="fireworks-container">
        <!-- Fireworks -->
        <ng-container *ngFor="let firework of fireworks">
            <div
              *ngFor="let particle of firework.particles"
              class="firework {{firework.color}}"
              [style.left.%]="firework.x"
              [style.top.%]="firework.y"
              [style.--tx.px]="particle.tx"
              [style.--ty.px]="particle.ty"
            >
            </div>
        </ng-container>

        <!-- Sparkles -->
        <div
          *ngFor="let sparkle of sparkles"
          class="sparkle"
          [style.left.%]="sparkle.x"
          [style.top.%]="sparkle.y"
        >
        </div>

        <!-- Confetti -->
        <div
          *ngFor="let conf of confetti"
          class="confetti"
          [style.left.%]="conf.x"
          [style.top.%]="conf.y"
          [style.background]="conf.color"
          [style.animation-delay.s]="conf.delay"
        >
        </div>
    </div>

    <div
      @modalAnimation
      class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden z-10"
    >

        <!-- Close Button with RTL support -->
        <button
          (click)="closeModal()"
          class="absolute top-4 right-4 [dir=rtl]:right-auto [dir=rtl]:left-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200"
        >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
            </svg>
        </button>

        <!-- Content -->
        <div class="p-8 text-center">

            <ng-container *transloco="let t">
                <!-- Custom YouTube Icon with Animation -->
                <div class="inline-flex items-center justify-center mb-6">
                    <img
                      src="assets/images/youtube-icon.png"
                      [attr.alt]="t('youtubeModal.iconAlt')"
                      class="w-32 h-32 md:w-40 md:h-40 object-contain animate-bounce-slow drop-shadow-2xl"
                    />
                </div>

                <!-- Channel Name with Spring Boot Theme -->
                <div class="mb-4">
                    <div
                      class="inline-flex items-center justify-center px-6 py-2 bg-gradient-to-r from-green-500 to-green-600 dark:from-green-600 dark:to-green-700 rounded-full shadow-lg"
                    >
                        <span class="text-2xl md:text-3xl font-bold text-white tracking-wider">
                            {{ t('youtubeModal.channelName') }}
                        </span>
                        <span class="ml-2 text-green-200">🍃</span>
                    </div>
                </div>

                <!-- Title -->
                <h2 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-3">
                    {{ t('youtubeModal.title') }}
                </h2>

                <!-- Description -->
                <p class="text-base md:text-lg text-gray-600 dark:text-gray-300 mb-6">
                    {{ t('youtubeModal.description') }}
                </p>

                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <button
                      (click)="visitYouTube()"
                      class="px-6 py-3 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 dark:from-green-500 dark:to-green-600 dark:hover:from-green-600 dark:hover:to-green-700 text-white font-semibold rounded-full shadow-lg transition-all duration-300 transform hover:scale-105"
                    >
                        <span class="flex items-center justify-center gap-2">
                            <svg
                              class="w-5 h-5"
                              fill="currentColor"
                              viewBox="0 0 24 24"
                            >
                                <path
                                  d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"
                                />
                            </svg>
                            {{ t('youtubeModal.visitButton') }}
                        </span>
                    </button>

                    <button
                      (click)="closeModal()"
                      class="px-6 py-3 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold rounded-full transition-all duration-200"
                    >
                        {{ t('youtubeModal.laterButton') }}
                    </button>
                </div>

                <!-- Small note -->
                <p class="mt-4 text-xs text-gray-500 dark:text-gray-400">
                    {{ t('youtubeModal.note') }}
                </p>
            </ng-container>
        </div>

        <!-- Decorative gradient with Spring Boot theme -->
        <div class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-transparent pointer-events-none"></div>
    </div>
</div>
